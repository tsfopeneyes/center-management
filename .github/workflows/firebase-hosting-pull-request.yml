name: Deploy to Firebase Hosting on PR
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: firebase-hosting-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
      VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
      VITE_ACCOUNT_AUTH_ENABLED: "true"
      VITE_ACCOUNT_AUTH_BASE_URL: https://erecqalsxoxrufggvmcc.supabase.co/functions/v1/account-auth
      VITE_WEB_PUSH_VAPID_PUBLIC_KEY: ${{ secrets.VITE_WEB_PUSH_VAPID_PUBLIC_KEY }}
      VITE_NAVER_MAPS_CLIENT_ID: ${{ secrets.VITE_NAVER_MAPS_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install and verify
        run: |
          npm ci
          node scripts/verify-supabase-config.mjs
          npm run test:baseline
      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SCI_CENTER_6F265 }}
        run: node scripts/prepare-firebase-ci-credentials.mjs
      - name: Build, preserve SCI Challenge, and deploy
        run: npx firebase-tools hosting:channel:deploy pr-${{ github.event.pull_request.number }} --expires 7d --project sci-center-6f265 --non-interactive
      - name: Clean up Firebase credentials
        if: always()
        run: node scripts/prepare-firebase-ci-credentials.mjs --cleanup
